<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#shine)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  
  <!-- Mouse cursor arrow -->
  <path d="M160 120 L160 310 L195 270 L240 330 L265 318 L220 258 L265 252 Z" 
        fill="#FFFFFF" stroke="rgba(67,56,202,0.3)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Click ripple dot (orange accent) -->
  <circle cx="265" cy="318" r="12" fill="#f26338" opacity="0.95"/>
  <circle cx="265" cy="318" r="22" fill="none" stroke="#f26338" stroke-width="2" opacity="0.4"/>
  <circle cx="265" cy="318" r="34" fill="none" stroke="#f26338" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Text: Click -->
  <text x="256" y="420" text-anchor="middle" font-size="64" font-weight="700" 
        font-family="'Sora','Poppins','Inter',sans-serif" fill="#FFFFFF">Click</text>
  
  <!-- Text: Nsit (orange) -->
  <text x="256" y="420" text-anchor="middle" font-size="64" font-weight="700" 
        font-family="'Sora','Poppins','Inter',sans-serif" fill="#f26338"
        dx="132">Nsit</text>
  
  <!-- Tagline -->
  <text x="256" y="465" text-anchor="middle" font-size="16" font-weight="500" 
        letter-spacing="4" font-family="'Inter',sans-serif" 
        fill="rgba(255,255,255,0.6)">CLICK. SIT. DONE.</text>
</svg>